# ============================================================
#  预置问题库模板
# ============================================================
# 说明：
#   1. 程序首次启动时会自动把下面这些问题写入问题库（只在问题库为空时执行一次）；
#   2. 这些是“用户会去问 AI 的问题”的常见问法示例，可自由增删；
#   3. 带 {品类} 占位符的问题，请把 {品类} 换成你自己的产品类别/行业
#      （例如“扫地机器人”“少儿英语培训”），也可以在问题库页手动增删；
#   4. 更省事的做法：在问题库页输入你的关键词，点“用关键词扩展问法”，
#      让系统用 AI 自动生成贴合你行业的问题。
# ============================================================

categories:
  选购咨询:
    - "想买一个靠谱的{品类}，有什么推荐？"
    - "{品类}怎么选？新手买前应该看哪些点？"
    - "性价比高的{品类}有哪些？"
    - "预算有限的情况下，{品类}应该怎么挑？"
    - "第一次买{品类}需要注意什么？"
    - "有哪些口碑不错的{品类}值得入手？"
  对比评测:
    - "{品类}和{品类}比，哪个更好？"
    - "{品类}的优缺点分别是什么？"
    - "便宜的{品类}和贵的{品类}差距有多大？"
    - "哪个品牌的{品类}最靠谱？"
    - "国产品牌的{品类}和外国的比，差距在哪？"
  口碑评价:
    - "{品类}的真实使用体验怎么样？"
    - "用过的朋友说，{品类}有哪些槽点？"
    - "{品类}值不值得买？"
    - "网上对{品类}的评价靠谱吗？"
    - "{品类}容易出问题吗？售后怎么样？"
  使用教程:
    - "{品类}怎么用才能发挥最大作用？"
    - "{品类}常见问题怎么解决？"
    - "新手用{品类}最容易犯哪些错？"
    - "{品类}应该多久保养/更新一次？"
    - "有没有{品类}的使用技巧和避坑指南？"
  价格优惠:
    - "{品类}什么时候买最划算？"
    - "{品类}多少钱算正常价？"
    - "{品类}有没有优惠活动？怎么买便宜？"
    - "{品类}二手值得买吗？"
  行业动态:
    - "2026年{品类}行业有哪些新趋势？"
    - "现在入手{品类}合适吗？"
    - "{品类}未来的发展方向是什么？"
    - "最近{品类}领域有什么值得关注的新品？"
  避坑建议:
    - "买{品类}最容易踩的坑有哪些？"
    - "{品类}有哪些套路和陷阱？"
    - "哪些{品类}不要买？"
    - "买{品类}前一定要搞清楚哪几件事？"
  通用问题:
    - "请推荐一下今年值得买的{品类}。"
    - "关于{品类}，我需要了解哪些基础知识？"
    - "{品类}的知名品牌有哪些？各自特点是什么？"
    - "如何判断{品类}的质量好坏？"
