# ============================================================
#  GEO 优化系统 配置文件模板
# ============================================================
# 使用方法（大白话）：
#   1. 本文件是“模板”，所有钥匙（API Key）都留空；
#   2. 程序第一次启动时，会自动把它复制一份成 config.yaml（在同一个文件夹里），
#      之后程序只读 config.yaml；
#   3. 你只需要去各家 AI 平台的官网注册、创建钥匙（API Key），
#      把钥匙填到 config.yaml 里对应的位置，保存后重启程序即可；
#   4. 模型档位、引擎开关也可以在程序“设置页”里改，不用手动改这个文件。
# ============================================================

# ---------- 监测引擎（5 家 + 手动粘贴） ----------
# 每家引擎都支持：开关（enabled）、钥匙（api_key，留空即可）、
# 接口地址（base_url，一般不用改）、模型档位（model，设置页可切换）、
# 是否支持联网提问（supports_web_search，联网档界面置灰用，一般不用改）。
engines:
  deepseek:
    enabled: true
    display_name: "DeepSeek"
    api_key: ""
    base_url: "https://api.deepseek.com"
    # 联网提问走 Responses API（api-docs.deepseek.com/zh-cn/guides/responses_api）
    supports_web_search: true
    # 联网档模型名（官方支持联网的模型；缺省回落 model）；如官方工具名变化改 web_tool_type
    web_model: "deepseek-v4-flash"
    web_tool_type: "web_search"
    # 档位默认 V4-Flash（最便宜，日常监测推荐）；设置页可切换
    model: "deepseek-v4-flash"
    model_options:
      - { name: "deepseek-v4-flash", desc: "V4-Flash 最便宜档，日常监测推荐" }
      - { name: "deepseek-v4-pro", desc: "V4-Pro 更强推理，费用更高" }

  kimi:
    enabled: true
    display_name: "Kimi"
    api_key: ""
    base_url: "https://api.moonshot.cn/v1"
    supports_web_search: true
    # 联网提问档模型（官方当前在售模型，经济档建议 kimi-k2.6，思考开启）；可改。
    web_model: "kimi-k2.6"
    # 默认经济档（比旗舰档便宜一个量级）；设置页可切换。
    # 提示：如平台提示模型名不存在，请到月之暗面开放平台控制台查看最新模型名，填到下面。
    model: "kimi-k2-turbo-preview"
    model_options:
      - { name: "kimi-k2-turbo-preview", desc: "经济档，日常监测推荐，费用低" }
      - { name: "kimi-k2.6", desc: "主力档，联网提问效果好" }
      - { name: "kimi-k3", desc: "旗舰档，回答质量最高，但很贵（慎选）" }

  doubao:
    enabled: true
    display_name: "豆包"
    api_key: ""
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    # 联网提问走 Responses API（控制台需开通「联网内容插件 Web Search」）
    supports_web_search: true
    # 默认档
    model: "doubao-seed-2-1-turbo-260628"
    model_options:
      - { name: "doubao-seed-2-1-turbo-260628", desc: "" }
      - { name: "doubao-seed-2-0-mini-260428", desc: "" }
      - { name: "doubao-seed-2-0-lite-260428", desc: "" }
      - { name: "doubao-seed-2-1-pro-260628", desc: "" }

  qwen:
    enabled: true
    display_name: "通义千问"
    api_key: ""
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    # 联网提问走 enable_search 增强（无需申请，接口自动联网）
    supports_web_search: true
    # 默认 Plus 档（经典文本档，联网引用信息完整）；设置页可切换
    model: "qwen-plus"
    model_options:
      - { name: "qwen-plus", desc: "经典 Plus 档，联网信源完整，日常监测推荐" }
      - { name: "qwen3.7-flash", desc: "新 Flash 档，更快更便宜" }
      - { name: "qwen3.7-plus", desc: "新 Plus 档，质量更好" }
      - { name: "qwen3.8-max", desc: "Max 旗舰档，质量最高但贵" }

  yuanbao:
    enabled: true
    display_name: "腾讯元宝（混元底座）"
    # 口径说明（用户裁决 D1 方案 A）：腾讯元宝没有官方公开 API，
    # 本位置使用腾讯云「混元」官方 API 作为“元宝同门底座”接入，
    # 回答口径与元宝 App 可能存在差异，报告中已如实标注。
    note: "本数据来自腾讯混元官方 API（元宝同门底座），与元宝 App 的回答口径可能存在差异。"
    api_key: ""
    base_url: "https://api.hunyuan.cloud.tencent.com/v1"
    # 联网提问走 enable_enhancement 功能增强（含搜索与引用）
    supports_web_search: true
    # 默认 turbos 档；设置页可切换。如提示模型不存在，请到腾讯云混元控制台确认最新模型名。
    model: "hunyuan-turbos-latest"
    model_options:
      - { name: "hunyuan-turbos-latest", desc: "turbos 档，性价比高，日常监测推荐" }
      - { name: "hunyuan-turbo-latest", desc: "turbo 档，更便宜" }
      - { name: "hunyuan-lite-latest", desc: "lite 档，最便宜（无联网搜索能力）" }

  opencode:
    enabled: true
    display_name: "OpenCode"
    # 口径说明：OpenCode Go 订阅套餐（官方文档 https://opencode.ai/docs/zh-cn/go）。
    # 套餐制计费，token 费用估算表不含它（api_call_log 仍会记录每次调用）。
    note: "OpenCode Go 订阅托管模型，费用按套餐计，不计入「本月大概花了多少钱」估算。"
    api_key: ""
    # 订阅套餐的 API 网关地址（Go 档）；网关按模型自动路由三种形态
    # （chat/completions、responses、messages），适配器已按官方端点表处理
    base_url: "https://opencode.ai/zen/go/v1"
    # 官方 API 未提供联网搜索工具（websearch 是 opencode 客户端本地能力），联网档自动排除
    supports_web_search: false
    # 默认档：DeepSeek V4 Flash（请求配额最大，便宜稳定）
    model: "deepseek-v4-flash"
    # Go 套餐支持的全部模型（官方端点表）
    model_options:
      - { name: "grok-4.5", desc: "Grok 4.5" }
      - { name: "glm-5.3", desc: "GLM-5.3" }
      - { name: "glm-5.2", desc: "GLM-5.2" }
      - { name: "glm-5.1", desc: "GLM-5.1" }
      - { name: "gpt-5.6-luna", desc: "GPT 5.6 Luna" }
      - { name: "kimi-k3", desc: "Kimi K3" }
      - { name: "kimi-k2.7-code", desc: "Kimi K2.7 Code" }
      - { name: "kimi-k2.6", desc: "Kimi K2.6" }
      - { name: "mimo-v2.5", desc: "MiMo-V2.5" }
      - { name: "mimo-v2.5-pro", desc: "MiMo-V2.5-Pro" }
      - { name: "minimax-m3", desc: "MiniMax M3" }
      - { name: "minimax-m2.7", desc: "MiniMax M2.7" }
      - { name: "minimax-m2.5", desc: "MiniMax M2.5" }
      - { name: "qwen3.8-max", desc: "Qwen3.8 Max" }
      - { name: "qwen3.7-max", desc: "Qwen3.7 Max" }
      - { name: "qwen3.7-plus", desc: "Qwen3.7 Plus" }
      - { name: "qwen3.6-plus", desc: "Qwen3.6 Plus" }
      - { name: "deepseek-v4-pro", desc: "DeepSeek V4 Pro" }
      - { name: "deepseek-v4-flash", desc: "DeepSeek V4 Flash" }
      - { name: "hy3", desc: "Hy3" }

# ---------- 分析用大模型 ----------
# 系统“自己的思考”用：关键词扩展问法、内容优化建议等。
# 厂商可在设置页切换（deepseek/kimi/doubao/qwen/yuanbao/opencode），
# 切换后复用该厂商引擎节的钥匙/接口地址/档位；本节仅作 deepseek
# 厂商的旧配置回落（引擎钥匙未填时用这里的钥匙/地址/模型）。
analysis:
  api_key: ""
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-flash"
  model_options:
    - { name: "deepseek-v4-flash", desc: "V4-Flash 最便宜档，日常分析推荐" }
    - { name: "deepseek-v4-pro", desc: "V4-Pro 更强推理，费用更高" }

# ---------- 定时自动监测 ----------
# 注意：此节仅作默认值参考，实际生效值以「设置页」保存的为准（存在本地数据库 settings 表），
# 手动改这里不会生效——想改时间/开关请到设置页操作。
# 默认每天 08:30（避开 DeepSeek 高峰加价时段）。
schedule:
  enabled: true
  time: "08:30"

# ---------- 网页抓取 ----------
fetch:
  timeout_seconds: 10
  max_chars: 50000
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

# ---------- 自动监测的节奏（一般不用改） ----------
monitor:
  temperature: 0.3            # 回答温度：越低越稳定（不要超过 0.3）
  min_interval: 1.5           # 两次调用之间最短间隔（秒）
  max_interval: 3.0           # 两次调用之间最长间隔（秒）
  max_retries: 2              # 单条失败最多重试次数
  retry_backoff_seconds: 2    # 重试等待的起始秒数（指数翻倍）
  estimated_seconds_per_call: 10   # 单次调用预估耗时（秒），用于“预计还需多久”
  catchup_hours: 26           # 距上次成功监测超过该小时数，启动时自动补跑一轮

# ---------- 费用估算（单位：元 / 百万 token，输入/输出） ----------
# 只用于设置页“本月大概花了多少钱”的估算，实际以各平台账单为准；
# 各平台价格变化后，可自行修改本表，不用改程序。
pricing:
  deepseek-v4-flash: { input: 1, output: 2 }
  deepseek-v4-pro: { input: 3, output: 6 }
  kimi-k2: { input: 6.5, output: 27 }
  kimi-k3: { input: 20, output: 100 }
  moonshot-v1: { input: 6.5, output: 27 }
  doubao-lite: { input: 0.3, output: 0.6 }
  doubao-pro: { input: 0.8, output: 2 }
  doubao-1-5-lite: { input: 0.3, output: 0.6 }
  doubao-1-5-pro: { input: 0.8, output: 2 }
  doubao-seed-2: { input: 0.8, output: 8 }
  doubao-seed: { input: 0.8, output: 8 }
  qwen-max: { input: 12, output: 36 }
  qwen-plus: { input: 4, output: 12 }
  qwen-turbo: { input: 2, output: 6 }
  qwen3.7-flash: { input: 1, output: 3 }
  qwen3.7-plus: { input: 4, output: 12 }
  qwen3.8-max: { input: 12, output: 36 }
  hunyuan-turbos: { input: 8, output: 16 }
  hunyuan-turbo: { input: 4, output: 8 }
  hunyuan-lite: { input: 1, output: 2 }
