<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 - GEO 优化系统</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>

<div class="page">
  <div class="page-title">设置</div>

  <!-- 卡片1：我的品牌 -->
  <div class="card" id="brand">
    <div class="card-head">
      <div>
        <div class="card-title">我的品牌（<span id="brand-count">0</span>/5）</div>
      </div>
      <div style="text-align:right">
        <button class="btn btn-secondary" id="brand-new-btn">＋ 新建品牌</button>
        <div class="small-note mt-8 hidden" id="brand-full-hint">最多 5 个品牌，已达上限；如需新增，请先删除一个不再使用的品牌。</div>
      </div>
    </div>
    <div id="brand-list"></div>
    <!-- 钥匙填写入口预留位（后续版本启用）-->
    <div class="brand-key-reserve"></div>
  </div>

  <!-- 卡片2：各家 AI 的模型配置（钥匙 + 模型型号，整合） -->
  <div class="card" id="keys">
    <div class="card-title">各家 AI 的模型配置</div>

    <div class="hidden orange-banner" id="keys-no-key-banner">
      请先填写至少一把 API 钥匙，才能开始第一次监测（约需 2 分钟）
      <button class="btn-text" id="keys-jump-first" style="color:var(--alert-text)">跳到第一把钥匙</button>
    </div>

    <div id="keys-list"></div>
    <div class="small-note mt-8">钥匙保存在你电脑的 config.yaml 文件中，不会上传；已填写的钥匙在页面上仅显示脱敏样式。</div>
  </div>

  <!-- 卡片4：每天自动监测 -->
  <div class="card" id="schedule">
    <div class="card-title">每天自动监测</div>
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <span style="display:flex;align-items:center;gap:10px">
        <label class="switch"><input type="checkbox" id="schedule-enabled"><span class="slider"></span></label>
        <span id="schedule-enabled-text">定时监测已开启</span>
      </span>
      <span style="display:flex;align-items:center;gap:8px">
        <label class="field-label" style="margin:0">每天</label>
        <input type="time" class="input" id="schedule-time" value="08:30" step="1800" style="width:auto">
      </span>
      <button class="btn btn-primary" id="schedule-save">保存</button>
      <span class="saved-hint hidden" id="schedule-saved-hint">已保存 ✓</span>
    </div>
    <div class="mt-8" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <span style="font-weight:600">监测模式（可多选）</span>
      <label class="checkbox-row" style="padding:0"><input type="checkbox" id="schedule-mode-normal"> 常规提问</label>
      <label class="checkbox-row" style="padding:0"><input type="checkbox" id="schedule-mode-web"> 联网提问</label>
    </div>
    <div class="web-cost-note hidden" id="schedule-web-cost">联网模式每天费用增加约 0.5~2.5 元，每月约增加 15~75 元（以平台账单为准）。</div>
    <div class="score-sub mt-8 hidden" id="schedule-brand-count"></div>
    <div class="score-sub mt-8" id="schedule-next">下次自动监测：--</div>
    <div class="score-sub mt-8">请保持程序运行，定时监测才能按时执行</div>
  </div>

  <!-- 卡片5：本月费用估算 -->
  <div class="card" id="cost">
    <div class="card-title">本月费用估算</div>
    <div class="card-sub">按各平台公开价格估算，实际以平台账单为准</div>
    <div id="cost-area"></div>
  </div>

  <!-- 卡片6：你的数据都在自己电脑上 -->
  <div class="card">
    <div class="card-title">你的数据都在自己电脑上</div>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/settings.js"></script>
</body>
</html>
