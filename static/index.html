<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEO 优化系统</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>

<div class="page">
  <div class="grid-2">
    <!-- 卡片1：AI 可见度评分 -->
    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title">AI 可见度评分</div>
        </div>
      </div>
      <div id="score-area"></div>
    </div>

    <!-- 卡片2：预警 -->
    <div class="card">
      <div class="card-title">预警</div>
      <div id="alert-area"></div>
    </div>
  </div>

  <div class="grid-2">
    <!-- 卡片3：最近一轮监测摘要 -->
    <div class="card">
      <div class="card-title">最近一轮监测</div>
      <div id="last-round-area"></div>
    </div>

    <!-- 卡片4：下次自动监测 -->
    <div class="card">
      <div class="card-title">下次自动监测</div>
      <div id="schedule-area"></div>
    </div>
  </div>

  <!-- 快捷入口 -->
  <div class="quick-grid">
    <a class="quick-card" href="/static/optimize.html">
      <div class="qc-icon">✎</div>
      <div class="qc-title">内容优化</div>
    </a>
    <a class="quick-card" href="/static/monitor.html">
      <div class="qc-icon">📡</div>
      <div class="qc-title">发起监测</div>
    </a>
    <a class="quick-card" href="/static/questions.html">
      <div class="qc-icon">❓</div>
      <div class="qc-title">问题库</div>
    </a>
    <a class="quick-card" href="/static/report.html">
      <div class="qc-icon">📊</div>
      <div class="qc-title">看报告</div>
    </a>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/index.js"></script>
</body>
</html>
