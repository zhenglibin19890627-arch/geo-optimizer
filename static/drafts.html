<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>稿件库 - GEO 优化系统</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 14px 0 12px; }
  .pub-line {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--card, #fff); border: 1px solid var(--border, #E2E8F0); border-radius: 10px;
    padding: 8px 12px; margin-bottom: 14px; font-size: 13px;
  }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
  .tag-green { background: #E9F9EF; color: var(--success, #16A34A); }
  .tag-gray { background: #F1F5F9; color: var(--text-sub, #6B7280); }
  .stat-tile {
    background: var(--card, #fff); border: 1px solid var(--border, #E2E8F0); border-radius: 10px;
    padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer;
    transition: box-shadow .15s, transform .15s;
  }
  .stat-tile:hover { box-shadow: 0 4px 14px rgba(31,41,55,.08); transform: translateY(-1px); }
  .stat-tile.active { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); }
  .stat-icon { width: 38px; height: 38px; border-radius: 9px; display: flex; align-items: center;
    justify-content: center; font-size: 19px; }
  .stat-num { font-size: 22px; font-weight: 700; line-height: 1.1; }
  .stat-label { font-size: 12px; color: var(--text-sub, #6B7280); margin-top: 2px; }
  .toolbar {
    display: flex; gap: 8px; align-items: center; flex-wrap: nowrap;
    background: var(--card, #fff); border: 1px solid var(--border, #E2E8F0);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 14px;
  }
  .toolbar .input, .toolbar select.input { padding: 5px 9px; font-size: 13px; min-width: 0; }
  .toolbar select.input { flex-shrink: 1; width: auto; }
  .toolbar .input[type="date"] { width: 132px; flex-shrink: 1; }
  .draft-card {
    background: var(--card, #fff); border: 1px solid var(--border, #E2E8F0); border-radius: 10px;
    padding: 14px 16px 12px 18px; margin-bottom: 12px; position: relative; overflow: hidden;
  }
  .draft-card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  }
  .draft-card.st-published::before { background: var(--success, #16A34A); }
  .draft-card.st-draft::before { background: var(--neutral, #6B7280); }
  .draft-card.st-failed::before { background: var(--danger, #DC2626); }
  .draft-head { display: flex; align-items: flex-start; gap: 10px; }
  .draft-title-main { font-size: 15px; font-weight: 600; color: var(--text-main, #1F2937);
    cursor: pointer; line-height: 1.45; }
  .draft-title-main:hover { color: var(--primary); }
  .draft-meta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    margin-top: 6px; font-size: 12px; color: var(--text-sub, #6B7280); }
  .platform-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .p-chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px;
    font-size: 12px; border: 1px solid var(--border, #E2E8F0); background: #FAFBFC; color: var(--text-main, #1F2937);
  }
  .p-dot { width: 7px; height: 7px; border-radius: 50%; }
  .p-dot.ok { background: var(--success, #16A34A); }
  .p-dot.bad { background: var(--danger, #DC2626); }
  .p-dot.run { background: var(--warn, #F59E0B); }
  .p-dot.idle { background: #CBD5E1; }
  .p-chip a { color: var(--primary); text-decoration: none; }
  .draft-actions { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }
  .btn-xs { padding: 3px 10px; font-size: 12px; border-radius: 6px; }
  .src-badge { background: var(--primary-light, #EFF4FF); color: var(--primary);
    padding: 1px 8px; border-radius: 10px; font-size: 11px; }
  .modal-mask {
    display: none; position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 90;
    align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto;
  }
  .modal-mask.show { display: flex; }
  .modal-box {
    background: #fff; border-radius: 12px; max-width: 820px; width: 100%;
    padding: 22px 26px; box-shadow: 0 20px 50px rgba(15,23,42,.25);
  }
  .modal-body { white-space: pre-wrap; line-height: 1.75; font-size: 14px; color: var(--text-main, #1F2937);
    max-height: 55vh; overflow-y: auto; border-top: 1px solid var(--border, #E2E8F0); padding-top: 12px; margin-top: 12px; }
  @media (max-width: 760px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<div class="page">
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div class="page-title" style="margin-bottom:0">稿件库</div>
    <span class="small-note">生成、审阅、发布状态的统一台账</span>
    <a class="btn btn-primary" href="/static/distribution.html"
       style="margin-left:auto;text-decoration:none">✍️ 去创作新稿件</a>
  </div>

  <div class="stats-row">
    <div class="stat-tile" data-st="">
      <div class="stat-icon" style="background:var(--primary-light,#EFF4FF)">📚</div>
      <div><div class="stat-num" id="st-all">0</div><div class="stat-label">总稿件</div></div>
    </div>
    <div class="stat-tile" data-st="published">
      <div class="stat-icon" style="background:#E9F9EF">✅</div>
      <div><div class="stat-num" id="st-published" style="color:var(--success,#16A34A)">0</div><div class="stat-label">已发布</div></div>
    </div>
    <div class="stat-tile" data-st="draft">
      <div class="stat-icon" style="background:#F1F5F9">📝</div>
      <div><div class="stat-num" id="st-draft" style="color:var(--text-sub,#6B7280)">0</div><div class="stat-label">待审阅</div></div>
    </div>
    <div class="stat-tile" data-st="failed">
      <div class="stat-icon" style="background:#FDEEEE">⚠️</div>
      <div><div class="stat-num" id="st-failed" style="color:var(--danger,#DC2626)">0</div><div class="stat-label">发布失败</div></div>
    </div>
  </div>

  <div class="pub-line" id="d-publine">
    <span id="d-bridge">…</span>
    <span id="d-chan-stats"></span>
    <span style="flex:1"></span>
    <span class="small-note">平台后台：</span>
    <a href="https://www.zhihu.com/people/zheng-li-bin-zheng-li-bin" target="_blank" rel="noopener" class="small-note">知乎我的主页 ↗</a>
    <a href="https://mp.sohu.com/mpfe/v4/contentManagement/first/page" target="_blank" rel="noopener" class="small-note">搜狐号主页 ↗</a>
    <a href="https://mp.toutiao.com/profile_v4/graphic/articles" target="_blank" rel="noopener" class="small-note">头条内容管理 ↗</a>
  </div>

  <div class="toolbar">
    <input class="input" id="d-search" placeholder="🔍 搜索标题 / 摘要…" style="flex:1;min-width:100px">
    <select class="input" id="d-status">
      <option value="">全部状态</option>
      <option value="published">已发布</option>
      <option value="draft">待审阅</option>
      <option value="failed">发布失败</option>
    </select>
    <select class="input" id="d-time">
      <option value="all">全部时间</option>
      <option value="week">最近一周</option>
      <option value="month">最近一月</option>
      <option value="custom">自定义…</option>
    </select>
    <span id="d-custom-range" class="hidden" style="display:inline-flex;gap:4px;align-items:center">
      <input type="date" class="input" id="d-date-start">
      <span class="small-note">至</span>
      <input type="date" class="input" id="d-date-end">
    </span>
    <button class="btn" id="d-refresh">刷新</button>
    <span class="small-note" id="d-count"></span>
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="card-head">
      <div class="card-title">平台历史文章</div>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="small-note" id="pa-last"></span>
        <select class="input" id="pa-platform" style="width:auto;padding:3px 8px">
          <option value="zhihu">知乎</option>
          <option value="sohu">搜狐号</option>
          <option value="toutiao">头条</option>
        </select>
        <button class="btn btn-primary btn-xs" id="pa-sync" disabled>同步历史文章</button>
      </div>
    </div>
    <div class="small-note" style="margin-bottom:4px">经分发桥调用扩展，用你各平台账号的登录态拉取账号下已发布的全部文章（约需几秒到十几秒，完成后页面自动刷新）。</div>
    <div id="pa-section"></div>
  </div>

  <div id="draft-list"></div>
</div>

<div class="modal-mask" id="view-mask">
  <div class="modal-box">
    <div style="display:flex;align-items:flex-start;gap:10px">
      <div style="flex:1">
        <div id="view-title" style="font-size:17px;font-weight:700;line-height:1.4"></div>
        <div id="view-meta" class="small-note" style="margin-top:6px"></div>
      </div>
      <button class="btn" id="view-close">关闭</button>
    </div>
    <div class="modal-body" id="view-body"></div>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/drafts.js"></script>
</body>
</html>
