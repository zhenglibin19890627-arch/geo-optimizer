<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>报告 - GEO 优化系统</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>

<div class="page">
  <div class="page-title">报告</div>

  <!-- 卡片A：常规 vs 联网 效果对比（近 30 轮汇总，固定口径） -->
  <div class="card hidden" id="compare-card">
    <div class="card-title">常规 vs 联网 效果对比</div>
    <div id="compare-body"></div>
  </div>

  <!-- 卡片1：历史趋势（07z 任务2：移到筛选框上方，作为"不动的总览"） -->
  <div class="card">
    <div class="card-title">历史趋势
      <span style="font-size:13px;color:var(--text-placeholder);font-weight:400">（总览·近30轮）</span>
      <span class="concept"><span class="q-mark">?</span><span class="bubble">情感倾向：AI 提到你时是夸（正面）、说坏话（负面）、还是就事论事（中性）。</span></span>
      <span class="concept"><span class="q-mark">?</span><span class="bubble">净情感率：夸你的回答数减去说坏话的回答数，再除以总回答数。结果越接近 100% 越好。</span></span>
    </div>
    <div class="small-note" id="trend-mode-note">蓝线是常规提问、绿线是联网提问，都已排除已停止、未成功的轮次。</div>
    <div class="small-note hidden" id="trend-comp-note"></div>
    <div class="tabs">
      <div class="tab-item active" data-metric="score">可见度评分</div>
      <div class="tab-item" data-metric="mention_rate">提及率</div>
      <div class="tab-item" data-metric="sentiment">情感倾向</div>
      <div class="tab-item" data-metric="competitor">竞品提及</div>
    </div>
    <div id="trend-chart" style="width:100%;height:320px"></div>
  </div>

  <!-- 顶部工具条（07z 任务2：趋势图下方；下方是所选轮次详情） -->
  <div class="card" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <div style="flex:1;min-width:220px">
      <div class="card-title" style="margin:0">选择查看哪一轮</div>
    </div>
    <select class="select" id="report-round-select" style="width:auto;min-width:220px"></select>
    <div class="score-sub" id="report-round-time" style="margin:0"></div>
  </div>

  <!-- 卡片3：引用信源排行（常规档回答无引用信源，选中常规轮时整卡隐藏） -->
  <div class="card" id="sources-card">
    <div class="card-title">引用信源排行
      <span class="concept"><span class="q-mark">?</span><span class="bubble">AI 回答时引用了哪些网站的信息。知道这些，你就知道该把内容布局到哪里去。</span></span>
    </div>
    <div id="sources-area"></div>
  </div>

  <!-- 卡片B：竞品深度分析（03b 7.2） -->
  <div class="card hidden" id="deep-card">
    <div class="card-title">竞品深度分析</div>
    <div class="deep-fee-note" id="deep-fee-note">
      <span>该板块由 AI 生成原因总结与优化方向，费用已计入「本月费用估算」。</span>
      <span class="deep-fee-close" id="deep-fee-close">✕</span>
    </div>
    <div id="deep-guide" class="hidden"></div>
    <div id="deep-stat-section" class="mt-12"></div>
    <div id="deep-analysis-section" class="mt-16"></div>
  </div>

  <!-- 卡片4：本轮详情（引擎明细） -->
  <div class="card" id="round-detail-card">
    <div class="collapse-head" id="round-detail-toggle">▸ 查看本轮引擎明细</div>
    <div class="collapse-body" id="round-detail-body"></div>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/vendor/echarts.min.js"></script>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/js/report-trend.js"></script>
<script src="/static/js/report-deep.js"></script>
<script src="/static/js/report.js"></script>
</body>
</html>
